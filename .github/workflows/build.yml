name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        run: |
          mkdir -p android
          cat > android/settings.gradle <<'FILE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "QuizApp"
          include ':app'
          FILE_EOF
          mkdir -p android
          cat > android/build.gradle <<'FILE_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FILE_EOF
          mkdir -p android
          cat > android/gradle.properties <<'FILE_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          FILE_EOF
          mkdir -p android/app
          cat > android/app/build.gradle <<'FILE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ge.quiz.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'ge.quiz.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          FILE_EOF
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="ჩემი ქვიზი"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FILE_EOF
          mkdir -p android/app/src/main/java/ge/quiz/app
          cat > android/app/src/main/java/ge/quiz/app/MainActivity.java <<'FILE_EOF'
          package ge.quiz.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          FILE_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#7A1F3D" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,54m-26,0a26,26 0 1,1 52,0a26,26 0 1,1 -52,0" />
              <path android:fillColor="#7A1F3D" android:pathData="M54,54m-16,0a16,16 0 1,1 32,0a16,16 0 1,1 -32,0" />
              <path android:fillColor="#FFFFFF" android:pathData="M60,64l12,12l-6,6l-12,-12z" />
          </vector>
          FILE_EOF
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
